<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Server je nedostupný</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #101215;
      color: #fafdff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
    }
    .card {
      max-width: 360px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-container {
      background-color: #1a1e24;
      border: 1px solid #2f353e;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .logo-svg {
      width: 64px;
      height: 64px;
      display: block;
    }
    h1 {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: #ffffff;
    }
    p {
      font-size: 13px;
      color: #9ca3af;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: rgba(26, 30, 36, 0.8);
      border: 1px solid rgba(47, 53, 62, 0.6);
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 12px;
      font-family: monospace;
      color: #3aa398;
      margin-bottom: 28px;
    }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid transparent;
      border-top-color: #3aa398;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      background-color: #1a1e24;
      border: 1px solid #2f353e;
      color: #e5e7eb;
      font-size: 13px;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 14px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn:active {
      transform: scale(0.96);
      background-color: #242930;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <svg class="logo-svg" viewBox="0 0 160 160">
        <path fill="#fafdff" d="M79.97,46.15h-39.09s-19.55,33.85-19.55,33.85l19.48,33.74h17.06s0,.08,0,.11c-.06,9.3-7.61,16.81-16.93,16.81-9.35,0-16.93-7.58-16.93-16.93H1.85s19.54,33.85,19.54,33.85h39.09s19.48-33.74,19.48-33.74h0s19.55-33.85,19.55-33.85l-19.54-33.85ZM51.96,94.66c-8.1-4.68-10.87-15.03-6.2-23.12s15.03-10.87,23.12-6.19,10.87,15.03,6.2,23.12c-4.67,8.09-15.03,10.87-23.12,6.2Z"/>
        <path fill="#3aa398" d="M79.97,113.85l19.55,33.85h39.09s19.55-33.85,19.55-33.85l-19.55-33.85h0s-11.08-19.19-11.08-19.19c-8.09,4.67-18.45,1.9-23.12-6.2-4.67-8.09-1.9-18.45,6.2-23.12l-11.08-19.19-19.54,33.85,19.55,33.85-19.54,33.85ZM104.4,122.32c-4.67-8.09-1.9-18.45,6.2-23.12s18.45-1.9,23.12,6.19c4.67,8.09,1.9,18.45-6.2,23.12-8.09,4.67-18.45,1.9-23.12-6.2Z"/>
      </svg>
    </div>

    <h1>Server je nedostupný</h1>
    <p>Aplikace se nemůže spojit s centrálním serverem dílny. Spojení je automaticky a průběžně ověřováno.</p>

    <div class="badge">
      <div class="spinner"></div>
      <span id="status-text">Zjišťuji dostupnost...</span>
    </div>

    <button class="btn" id="retry-btn" onclick="checkServer(true)">Zkusit znovu</button>
  </div>

  <script>
    var isChecking = false;
    var targetUrl = 'https://access.gypridilna.cz';

    async function checkServer(manual) {
      if (isChecking) return;
      isChecking = true;
      var statusText = document.getElementById('status-text');
      if (manual && statusText) statusText.innerText = 'Ověřuji...';

      try {
        var controller = new AbortController();
        var timeoutId = setTimeout(function() { controller.abort(); }, 3500);
        var res = await fetch(targetUrl + '/api/config', { cache: 'no-cache', signal: controller.signal });
        clearTimeout(timeoutId);
        if (res.ok) {
          if (statusText) statusText.innerText = 'Připojeno!';
          window.location.replace(targetUrl);
          return;
        }
      } catch (e) {
        // Server still unavailable
      } finally {
        isChecking = false;
        if (statusText) statusText.innerText = 'Zjišťuji dostupnost...';
      }
    }

    // Auto-poll every 3 seconds
    setInterval(function() { checkServer(false); }, 3000);
    window.addEventListener('online', function() { checkServer(true); });
  </script>
</body>
</html>
