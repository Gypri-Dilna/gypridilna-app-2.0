<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gypri Dílna | RFID Access & Inventory</title>

    <!-- Google Fonts: Montserrat (All UI) & Fira Code (Monospace Code/SKUs) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Google Identity Services (GSI) SDK for Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Montserrat', 'sans-serif'],
              mono: ['Fira Code', 'monospace'],
            },
            colors: {
              brand: {
                teal: '#3aa398',       /* Official Gypri Dílna Brand Teal */
                'teal-hover': '#2f8b81',
                dark: '#2f353e',       /* Official Brand Charcoal */
                darker: '#242930',     /* Official Deep Background */
                bg: '#1b1f26',         /* Platform Page Background */
                light: '#fafdff',      /* Brand White / Light Text */
                border: '#39414d',     /* Solid Border */
                amber: '#F59E0B',
                emerald: '#10B981',
                rose: '#F43F5E',
              },
              primary: {
                50: '#f0faf9',
                100: '#d9f2ef',
                200: '#b7e6dd',
                300: '#8fd9ca',
                400: '#62c8b7',
                500: '#3aa398',
                600: '#2f8b81',
                700: '#29786f',
                800: '#25615a',
                900: '#22514c',
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Montserrat', sans-serif;
      }
      code, pre, .font-mono {
        font-family: 'Fira Code', monospace !important;
      }
      @keyframes modalPopIn {
        from {
          opacity: 0;
          transform: scale(0.94) translateY(12px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      @keyframes backdropFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes pageTransition {
        0% {
          opacity: 0;
          transform: translateY(14px);
        }
        99% {
          opacity: 1;
          transform: translateY(0);
        }
        100% {
          opacity: 1;
          transform: none;
        }
      }

      .animate-modal-pop {
        animation: modalPopIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .animate-backdrop-fade {
        animation: backdropFadeIn 0.22s ease-out forwards;
      }

      .animate-page-transition {
        animation: pageTransition 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @media print {
        body * {
          visibility: hidden;
        }
        .print-area, .print-area * {
          visibility: visible;
        }
        .print-area {
          position: absolute;
          left: 0;
          top: 0;
          width: 64mm !important;
          height: 18mm !important;
          margin: 0 !important;
          padding: 1mm !important;
          background: white !important;
          color: black !important;
        }
      }
    </style>
</head>
<body class="bg-brand-bg text-brand-light font-sans antialiased selection:bg-brand-teal selection:text-black">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
